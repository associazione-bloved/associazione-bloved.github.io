<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>associazione bloved — portal</title>
<meta name="description" content="associazione bloved — portal">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-row">
    <a class="wordmark" href="/">associazione <em>bloved</em></a>
    <p class="meta">portal · draft · <span id="stamp"></span></p>
  </div>
  <div class="wrap">
    <nav class="tabs" aria-label="Sections">
      <span class="tab is-active" aria-current="page">Home</span>
      <!-- add sections here; keep one <a class="tab" href="/…"> per feature -->
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="lede">
    <p class="eyebrow">/ home</p>
    <h1>The portal starts empty.</h1>
    <p class="sub">Features land one at a time, each as its own card below.</p>
  </section>

  <section aria-labelledby="features-h">
    <div class="section-head">
      <span class="lbl" id="features-h">Features</span>
      <span class="rule"></span>
      <span class="count">0 / 6</span>
    </div>
    <ul class="grid">
      <li class="card slot"><span class="num">01</span><span class="slot-label">empty</span></li>
      <li class="card slot"><span class="num">02</span><span class="slot-label">empty</span></li>
      <li class="card slot"><span class="num">03</span><span class="slot-label">empty</span></li>
      <li class="card slot"><span class="num">04</span><span class="slot-label">empty</span></li>
      <li class="card slot"><span class="num">05</span><span class="slot-label">empty</span></li>
      <li class="card slot"><span class="num">06</span><span class="slot-label">empty</span></li>
    </ul>
  </section>

</main>

<footer class="wrap foot">
  <span>associazione bloved</span>
  <span class="dot">·</span>
  <a href="https://github.com/associazione-bloved">github</a>
  <span class="dot">·</span>
  <span class="meta">built on github pages</span>
</footer>

<script>document.getElementById('stamp').textContent = new Date().toISOString().slice(0,10);</script>
</body>
</html>
